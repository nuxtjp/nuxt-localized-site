name: Stage reviewed npm archive
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [prepare, oidc]
        default: prepare
        required: true
      expected-archive-sha256:
        type: string
        required: true
        description: Owner-reviewed archive SHA256; same npm pack format as verification CI
permissions:
  contents: read
concurrency:
  group: package-publication-${{ github.repository }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      archive-sha256: ${{ steps.binding.outputs.archive-sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require approved public source and release tag
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          APPROVED_SHA: ${{ vars.REGISTRY_SECURITY_APPROVED_SHA }}
          PUBLISH_ENABLED: ${{ vars.REGISTRY_PUBLISH_ENABLED }}
        run: python3 .github/scripts/release-gate.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Install pinned managers, build and inspect without credentials
        run: bash .github/scripts/prepare-npm-release.sh
      - name: Bind archive to reviewed source
        id: binding
        env:
          OWNER_REVIEWED_ARCHIVE_SHA256: ${{ inputs.expected-archive-sha256 }}
        run: node .github/scripts/release-archive.mjs prepare "$RUNNER_TEMP/package-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: npm-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-release/
          if-no-files-found: error
          retention-days: 7
          overwrite: false
  publish:
    needs: prepare
    if: inputs.mode != 'prepare' && vars.REGISTRY_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-public
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck source, gates and registry state
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          APPROVED_SHA: ${{ vars.REGISTRY_SECURITY_APPROVED_SHA }}
          PUBLISH_ENABLED: ${{ vars.REGISTRY_PUBLISH_ENABLED }}
        run: python3 .github/scripts/release-gate.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.2.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/package-release
      - name: Verify prepared archive before authentication
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.prepare.outputs.archive-sha256 }}
        run: node .github/scripts/release-archive.mjs verify "$RUNNER_TEMP/package-release"
      - name: Subsequent staging with repository OIDC identity
        if: inputs.mode == 'oidc'
        env:
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: |
          set -o pipefail
          npm stage publish "$RUNNER_TEMP/package-release/nuxtjp-localized-site-0.2.1.tgz" --registry=https://registry.npmjs.org --access public --provenance --ignore-scripts | tee "$RUNNER_TEMP/npm-stage-result.txt"
      - name: Record pending stage and reviewed distribution for owner approval
        env:
          REVIEWED_ARTIFACT_ID: ${{ needs.prepare.outputs.artifact-id }}
        run: |
          {
            printf '%s\n' 'Staged only; not published. Owner: npmjs.com Staged Packages -> exact entry -> Approve with 2FA.' '```text'
            cat "$RUNNER_TEMP/npm-stage-result.txt"
            printf '%s\n' '```' 'Reviewed release (compare downloaded staged TGZ digest before approval):' '```json'
            cat "$RUNNER_TEMP/package-release/release.json"
            printf '%s\n' '```'
            printf 'Run %s attempt %s; reviewed artifact %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$REVIEWED_ARTIFACT_ID"
          } >> "$GITHUB_STEP_SUMMARY"
